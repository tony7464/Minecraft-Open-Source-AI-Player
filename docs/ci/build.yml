# GitHub Actions CI. To enable it, move this file to .github/workflows/build.yml
# (it was not pushed there automatically because the push token lacked the "workflow" scope).
name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and unit tests
        run: ./gradlew build

      - name: GameTests
        run: ./gradlew runGameTestServer
